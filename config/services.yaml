imports:
    - { resource: 'services_order_app.yaml' }

parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Document/'
            - '../src/Domain/Entity/'
            - '../src/Domain/ValueObject/'
            - '../src/Domain/Event/'
            - '../src/Infrastructure/Persistence/MongoDB/Document/'
            - '../src/Application/Command/'
            - '../src/Application/Query/'
            - '../src/Application/Event/'
            - '../src/Application/Exception/'
            - '../src/Presentation/Dto/'
            - '../src/Interface/Http/Dto/'
            - '../src/Interface/Http/Exception/'
            - '../src/Kernel.php'

    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    App\MessageHandler\:
        resource: '../src/MessageHandler/'
        tags: ['messenger.message_handler']

    App\Domain\Repository\OrderRepositoryInterface:
        alias: App\Infrastructure\Persistence\MongoDB\Repository\OrderRepository

    App\Domain\Repository\OrderItemRepositoryInterface:
        alias: App\Infrastructure\Persistence\MongoDB\Repository\OrderItemRepository

    App\Infrastructure\Persistence\MongoDB\Repository\OrderRepository:
        arguments:
            $documentManager: '@doctrine_mongodb.odm.document_manager'

    App\Infrastructure\Persistence\MongoDB\Repository\OrderItemRepository:
        arguments:
            $documentManager: '@doctrine_mongodb.odm.document_manager'

    App\Interface\Http\EventSubscriber\ApiExceptionSubscriber:
        arguments:
            $environment: '%kernel.environment%'

    App\Interface\Http\Controller\:
        resource: '../src/Interface/Http/Controller/'
        tags: ['controller.service_arguments']
