framework:
    messenger:
        failure_transport: failed
        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: ~

        transports:
            sync:
                dsn: 'sync://'

            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: orders
                        type: topic
                    queues:
                        orders_default:
                            binding_keys:
                                - 'order.#'
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 60000

            async_priority_high:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: orders_priority
                        type: topic
                    queues:
                        orders_priority:
                            binding_keys:
                                - 'order.submitted'
                                - 'order.cancelled'
                retry_strategy:
                    max_retries: 5
                    delay: 500
                    multiplier: 2
                    max_delay: 30000

            failed:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: failed
                        type: direct
                    queues:
                        failed:
                            binding_keys: [failed]

        routing:
            App\Message\ExampleMessage: async
            App\Infrastructure\Messaging\Message\OrderCreatedMessage: async
            App\Infrastructure\Messaging\Message\OrderSubmittedMessage: async_priority_high
            App\Infrastructure\Messaging\Message\OrderCancelledMessage: async_priority_high

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                async_priority_high: 'in-memory://'
                failed: 'in-memory://'

when@prod:
    framework:
        messenger:
            transports:
                async:
                    dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                    options:
                        exchange:
                            name: orders
                            type: topic
                        queues:
                            orders_default:
                                binding_keys:
                                    - 'order.#'
                    retry_strategy:
                        max_retries: 5
                        delay: 1000
                        multiplier: 2
                        max_delay: 60000
                async_priority_high:
                    dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                    options:
                        exchange:
                            name: orders_priority
                            type: topic
                        queues:
                            orders_priority:
                                binding_keys:
                                    - 'order.submitted'
                                    - 'order.cancelled'
                    retry_strategy:
                        max_retries: 5
                        delay: 500
                        multiplier: 2
                        max_delay: 30000
