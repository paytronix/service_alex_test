parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Document/'
            - '../src/Domain/Entity/'
            - '../src/Domain/ValueObject/'
            - '../src/Domain/Event/'
            - '../src/Infrastructure/Persistence/MongoDB/Document/'
            - '../src/Kernel.php'

    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    App\MessageHandler\:
        resource: '../src/MessageHandler/'
        tags: ['messenger.message_handler']

    App\Domain\Repository\OrderRepositoryInterface:
        alias: App\Infrastructure\Persistence\MongoDB\Repository\OrderRepository

    App\Domain\Repository\OrderItemRepositoryInterface:
        alias: App\Infrastructure\Persistence\MongoDB\Repository\OrderItemRepository

    App\Infrastructure\Persistence\MongoDB\Repository\OrderRepository:
        arguments:
            $documentManager: '@doctrine_mongodb.odm.document_manager'

    App\Infrastructure\Persistence\MongoDB\Repository\OrderItemRepository:
        arguments:
            $documentManager: '@doctrine_mongodb.odm.document_manager'
