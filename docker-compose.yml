version: '3.8'

services:
  php-fpm:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: service_alex_test_php
    restart: unless-stopped
    volumes:
      - ./:/app:cached
      - php_socket:/var/run/php
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_DEBUG: ${APP_DEBUG:-0}
      APP_SECRET: ${APP_SECRET}
      MONGODB_URL: ${MONGODB_URL:-mongodb://mongodb:27017/orders}
      MONGODB_DB: ${MONGODB_DB:-orders}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-amqp://guest:guest@rabbitmq:5672/%2f/messages}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-change_me_in_production}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - app_network

  nginx:
    image: nginx:1.25-alpine
    container_name: service_alex_test_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./public:/app/public:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - php_socket:/var/run/php
    depends_on:
      php-fpm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - app_network

  mongodb:
    image: mongo:7.0
    container_name: service_alex_test_mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    environment:
      MONGO_INITDB_DATABASE: orders
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - app_network

  redis:
    image: redis:7.2-alpine
    container_name: service_alex_test_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - app_network

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: service_alex_test_rabbitmq
    restart: unless-stopped
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - app_network

  messenger-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: service_alex_test_messenger
    restart: unless-stopped
    command: php bin/console messenger:consume async --time-limit=3600 --memory-limit=128M -vv
    volumes:
      - ./:/app:cached
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_DEBUG: ${APP_DEBUG:-0}
      APP_SECRET: ${APP_SECRET}
      MONGODB_URL: ${MONGODB_URL:-mongodb://mongodb:27017/orders}
      MONGODB_DB: ${MONGODB_DB:-orders}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-amqp://guest:guest@rabbitmq:5672/%2f/messages}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      php-fpm:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app_network

  supervisor:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: service_alex_test_supervisor
    restart: unless-stopped
    volumes:
      - ./:/app:cached
      - ./docker/supervisor/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_DEBUG: ${APP_DEBUG:-0}
      APP_SECRET: ${APP_SECRET}
      MONGODB_URL: ${MONGODB_URL:-mongodb://mongodb:27017/orders}
      MONGODB_DB: ${MONGODB_DB:-orders}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-amqp://guest:guest@rabbitmq:5672/%2f/messages}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    entrypoint: ["/usr/bin/supervisord", "-c", "/etc/supervisor/conf.d/supervisord.conf"]
    depends_on:
      php-fpm:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app_network

volumes:
  php_socket:
  mongodb_data:
  mongodb_config:
  redis_data:
  rabbitmq_data:

networks:
  app_network:
    driver: bridge
