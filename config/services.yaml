imports:
    - { resource: 'services_order_app.yaml' }

parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Document/'
            - '../src/Domain/Entity/'
            - '../src/Domain/ValueObject/'
            - '../src/Domain/Event/'
            - '../src/Infrastructure/Persistence/MongoDB/Document/'
            - '../src/Application/Command/'
            - '../src/Application/Query/'
            - '../src/Application/Event/'
            - '../src/Application/Exception/'
            - '../src/Presentation/Dto/'
            - '../src/Interface/Http/Dto/'
            - '../src/Interface/Http/Exception/'
            - '../src/Kernel.php'

    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    App\MessageHandler\:
        resource: '../src/MessageHandler/'
        tags: ['messenger.message_handler']

    App\Domain\Repository\OrderRepositoryInterface:
        alias: App\Infrastructure\Persistence\MongoDB\Repository\OrderRepository

    App\Domain\Repository\OrderItemRepositoryInterface:
        alias: App\Infrastructure\Persistence\MongoDB\Repository\OrderItemRepository

    App\Infrastructure\Persistence\MongoDB\Repository\OrderRepository:
        arguments:
            $documentManager: '@doctrine_mongodb.odm.document_manager'

    App\Infrastructure\Persistence\MongoDB\Repository\OrderItemRepository:
        arguments:
            $documentManager: '@doctrine_mongodb.odm.document_manager'

    App\Interface\Http\EventSubscriber\ApiExceptionSubscriber:
        arguments:
            $environment: '%kernel.environment%'

    App\Interface\Http\Controller\:
        resource: '../src/Interface/Http/Controller/'
        tags: ['controller.service_arguments']

    App\Infrastructure\ExternalService\RestaurantServiceClientInterface:
        alias: App\Infrastructure\ExternalService\StubRestaurantServiceClient

    App\Infrastructure\ExternalService\PaymentServiceClientInterface:
        alias: App\Infrastructure\ExternalService\StubPaymentServiceClient

    App\Infrastructure\ExternalService\POSServiceClientInterface:
        alias: App\Infrastructure\ExternalService\StubPOSServiceClient

    App\Infrastructure\ExternalService\StubRestaurantServiceClient:
        arguments:
            $isAvailable: true

    App\Infrastructure\Messaging\MessageHandler\:
        resource: '../src/Infrastructure/Messaging/MessageHandler/'
        tags: ['messenger.message_handler']

    App\Infrastructure\Messaging\Consumer\:
        resource: '../src/Infrastructure/Messaging/Consumer/'
        tags: ['messenger.message_handler']

    App\Infrastructure\Messaging\Service\MessageIdempotencyService:
        arguments:
            $cache: '@cache.app'
            $ttlSeconds: 86400

    App\Infrastructure\Messaging\Service\CircuitBreakerService:
        arguments:
            $cache: '@cache.app'
            $failureThreshold: 5
            $recoveryTimeSeconds: 30
            $halfOpenMaxAttempts: 3

    App\Infrastructure\Messaging\Service\RetryPolicyService:
        arguments:
            $maxRetries: 3
            $baseDelayMs: 1000
            $multiplier: 2.0
            $maxDelayMs: 60000

    App\Infrastructure\Messaging\Service\CorrelationIdService: ~

    App\Infrastructure\ExternalService\HttpRestaurantServiceClient:
        arguments:
            $baseUrl: '%env(RESTAURANT_SERVICE_URL)%'
            $timeout: 10

    App\Infrastructure\ExternalService\HttpPaymentServiceClient:
        arguments:
            $baseUrl: '%env(PAYMENT_SERVICE_URL)%'
            $timeout: 30

    App\Infrastructure\ExternalService\HttpPOSServiceClient:
        arguments:
            $baseUrl: '%env(POS_SERVICE_URL)%'
            $timeout: 15
